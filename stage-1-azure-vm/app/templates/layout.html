<!DOCTYPE html>
<!-- Shared pieces reused by every page: the <head> and the top menu. -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · RedeemALL'">RedeemALL</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="nav" class="topbar">
    <a class="brand" th:href="@{/}">RedeemALL</a>
    <nav>
        <a th:href="@{/}">Offers</a>
        <a th:href="@{/offers/new}">Add offer</a>
        <a th:href="@{/cards}">My cards</a>
        <form th:action="@{/logout}" method="post" class="inline">
            <button type="submit" class="link">Sign out <span sec:authentication="name"></span></button>
        </form>
    </nav>
</header>

<div th:fragment="messages">
    <p class="flash ok" th:if="${message}" th:text="${message}"></p>
    <p class="flash err" th:if="${error}" th:text="${error}"></p>
</div>
</body>
</html>
