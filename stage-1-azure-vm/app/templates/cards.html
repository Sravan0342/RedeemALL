<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('My cards')}"></head>
<body>
<header th:replace="~{layout :: nav}"></header>
<main>
    <h1>My cards</h1>
    <div th:replace="~{layout :: messages}"></div>

    <ul class="card-list">
        <li th:each="c : ${cards}">
            <span th:text="${c.label}">Card</span>
            <form th:action="@{/cards/{id}/delete(id=${c.id})}" method="post" class="inline"
                  onsubmit="return confirm('Delete this card?')">
                <button type="submit" class="danger">Delete</button>
            </form>
        </li>
        <li th:if="${#lists.isEmpty(cards)}" class="muted">No cards yet.</li>
    </ul>

    <h2>Add a card</h2>
    <p class="muted small">Only the last 4 digits are stored. Never enter the full card number.</p>
    <form th:action="@{/cards}" th:object="${cardForm}" method="post" class="card-box">
        <label>Nickname <input th:field="*{nickname}" placeholder="Travel card"></label>
        <p class="field-err" th:errors="*{nickname}"></p>
        <label>Bank / issuer <input th:field="*{issuer}" placeholder="Demo Bank"></label>
        <p class="field-err" th:errors="*{issuer}"></p>
        <label>Last 4 digits <input th:field="*{lastFour}" maxlength="4" inputmode="numeric" placeholder="1234"></label>
        <p class="field-err" th:errors="*{lastFour}"></p>
        <button type="submit">Add card</button>
    </form>
</main>
</body>
</html>
